<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工厂视觉监控</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171b22;
      --border: #262d38;
      --text: #e6edf3;
      --muted: #8b98a9;
      --accent: #38bdf8;
      --danger: #f87171;
      --ok: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    header h1::before {
      content: "●";
      color: var(--accent);
      margin-right: 10px;
    }
    .badge {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--panel);
    }
    .badge.live {
      color: var(--ok);
      border-color: rgba(52, 211, 153, 0.35);
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr);
      gap: 18px;
      max-width: 1500px;
      margin: 0 auto;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .card .head .name {
      font-size: 14px;
      font-weight: 600;
    }
    .card .head .status {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .card .head .status.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .card .video-wrap {
      position: relative;
      width: 100%;
      min-height: 620px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      overflow: hidden;
      cursor: crosshair;
    }
    .card .video-stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 620px;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
    .roi-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
      background: transparent;
      z-index: 2;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px 16px;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.01);
    }
    .toolbar button {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      padding: 7px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .toolbar button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .toolbar .hint {
      color: var(--muted);
      font-size: 12px;
      margin-left: auto;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>工厂视觉监控</h1>
    <span class="badge" id="status">连接中…</span>
  </header>
  <main id="grid"></main>

  <script>
    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");

    function buildCard(camId) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="head">
          <span class="name">${camId}</span>
          <span class="status" id="dot-${camId}"></span>
        </div>
        <div class="video-wrap">
          <div class="video-stage">
            <img id="img-${camId}" src="/video_feed/${camId}" alt="${camId}">
            <canvas class="roi-canvas" id="canvas-${camId}" width="1280" height="720"></canvas>
          </div>
        </div>
        <div class="toolbar">
          <button type="button" data-cam="${camId}" data-action="toggle">绘制区域</button>
          <button type="button" data-cam="${camId}" data-action="clear">清空区域</button>
          <span class="hint" id="hint-${camId}">已绘制: 0 个区域</span>
        </div>`;
      grid.appendChild(card);

      const img = card.querySelector("img");
      const dot = card.querySelector(".status");
      const canvas = card.querySelector("canvas");
      const hint = card.querySelector(".hint");
      const toggleBtn = card.querySelector("button[data-action='toggle']");
      const clearBtn = card.querySelector("button[data-action='clear']");

      const roiState = {
        enabled: false,
        drawing: false,
        start: null,
        rects: []
      };

      function drawRectangles() {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#f87171";
        ctx.fillStyle = "rgba(248, 113, 113, 0.18)";
        ctx.lineWidth = 2;

        roiState.rects.forEach((rect) => {
          ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
          ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
        });

        if (roiState.drawing && roiState.start) {
          const current = getCanvasPointFromEvent(window.__roiTempPointer || { x: 0, y: 0 });
          if (current) {
            const x = Math.min(roiState.start.x, current.x);
            const y = Math.min(roiState.start.y, current.y);
            const w = Math.abs(current.x - roiState.start.x);
            const h = Math.abs(current.y - roiState.start.y);
            ctx.fillRect(x, y, w, h);
            ctx.strokeRect(x, y, w, h);
          }
        }

        hint.textContent = `已绘制: ${roiState.rects.length} 个区域`;
      }

      function getCanvasPointFromEvent(evt) {
        const rect = canvas.getBoundingClientRect();
        const x = ((evt.clientX - rect.left) / rect.width) * canvas.width;
        const y = ((evt.clientY - rect.top) / rect.height) * canvas.height;
        return { x, y };
      }

      function handlePointerDown(evt) {
        if (!roiState.enabled) return;
        const point = getCanvasPointFromEvent(evt);
        roiState.drawing = true;
        roiState.start = point;
        drawRectangles();
      }

      function handlePointerMove(evt) {
        if (!roiState.enabled || !roiState.drawing || !roiState.start) return;
        window.__roiTempPointer = evt;
        drawRectangles();
      }

      function handlePointerUp(evt) {
        if (!roiState.enabled || !roiState.drawing || !roiState.start) return;

        const end = getCanvasPointFromEvent(evt);
        const x = Math.min(roiState.start.x, end.x);
        const y = Math.min(roiState.start.y, end.y);
        const w = Math.abs(end.x - roiState.start.x);
        const h = Math.abs(end.y - roiState.start.y);

        if (w > 8 && h > 8) {
          roiState.rects.push({ x, y, w, h });
        }

        roiState.drawing = false;
        roiState.start = null;
        delete window.__roiTempPointer;
        drawRectangles();
      }

      toggleBtn.addEventListener("click", () => {
        roiState.enabled = !roiState.enabled;
        canvas.style.pointerEvents = roiState.enabled ? "auto" : "none";
        toggleBtn.textContent = roiState.enabled ? "结束绘制" : "绘制区域";
        if (!roiState.enabled) {
          roiState.drawing = false;
          roiState.start = null;
          delete window.__roiTempPointer;
          drawRectangles();
        }
      });

      canvas.style.pointerEvents = "none";

      clearBtn.addEventListener("click", () => {
        roiState.rects = [];
        roiState.drawing = false;
        roiState.start = null;
        delete window.__roiTempPointer;
        drawRectangles();
      });

      canvas.addEventListener("pointerdown", handlePointerDown);
      canvas.addEventListener("pointermove", handlePointerMove);
      canvas.addEventListener("pointerup", handlePointerUp);
      canvas.addEventListener("pointerleave", handlePointerUp);

      img.addEventListener("load", () => {
        dot.classList.add("live");
        statusEl.textContent = "运行中";
        statusEl.classList.add("live");
      });
      img.addEventListener("error", () => {
        dot.classList.remove("live");
      });

      drawRectangles();
    }

    async function loadCameras() {
      try {
        const resp = await fetch("/api/cameras");
        const data = await resp.json();
        grid.innerHTML = "";
        if (!data.cameras || data.cameras.length === 0) {
          grid.innerHTML = '<div class="empty">暂无摄像头画面</div>';
          return;
        }
        data.cameras.forEach(buildCard);
      } catch (err) {
        grid.innerHTML = '<div class="empty">无法连接后端服务</div>';
        statusEl.textContent = "连接失败";
      }
    }

    loadCameras();
  </script>
</body>
</html>
