<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工厂视觉监控</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171b22;
      --border: #262d38;
      --text: #e6edf3;
      --muted: #8b98a9;
      --accent: #38bdf8;
      --danger: #f87171;
      --ok: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    header h1::before {
      content: "●";
      color: var(--accent);
      margin-right: 10px;
    }
    .badge {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--panel);
    }
    .badge.live {
      color: var(--ok);
      border-color: rgba(52, 211, 153, 0.35);
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .card .head .name {
      font-size: 14px;
      font-weight: 600;
    }
    .card .head .status {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .card .head .status.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .card .video-wrap {
      aspect-ratio: 16 / 9;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>工厂视觉监控</h1>
    <span class="badge" id="status">连接中…</span>
  </header>
  <main id="grid"></main>

  <script>
    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");

    function buildCard(camId) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="head">
          <span class="name">${camId}</span>
          <span class="status" id="dot-${camId}"></span>
        </div>
        <div class="video-wrap">
          <img id="img-${camId}" src="/video_feed/${camId}" alt="${camId}">
        </div>`;
      grid.appendChild(card);

      const img = card.querySelector("img");
      const dot = card.querySelector(".status");
      img.addEventListener("load", () => {
        dot.classList.add("live");
        statusEl.textContent = "运行中";
        statusEl.classList.add("live");
      });
      img.addEventListener("error", () => {
        dot.classList.remove("live");
      });
    }

    async function loadCameras() {
      try {
        const resp = await fetch("/api/cameras");
        const data = await resp.json();
        grid.innerHTML = "";
        if (!data.cameras || data.cameras.length === 0) {
          grid.innerHTML = '<div class="empty">暂无摄像头画面</div>';
          return;
        }
        data.cameras.forEach(buildCard);
      } catch (err) {
        grid.innerHTML = '<div class="empty">无法连接后端服务</div>';
        statusEl.textContent = "连接失败";
      }
    }

    loadCameras();
  </script>
</body>
</html>
